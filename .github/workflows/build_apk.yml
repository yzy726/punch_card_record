name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.32.8'
          cache: true
      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile
      - name: Format Dart sources
        run: dart format lib test
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Install preview font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Run regression and widget tests (UTC+8)
        run: flutter test --coverage --reporter expanded
      - name: Verify dates across DST (UTC-8 / UTC-7)
        run: TZ=America/Los_Angeles flutter test test/calendar_date_test.dart test/punch_provider_test.dart --reporter expanded
      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ github.run_number }}
          path: |
            pubspec.lock
            lib/
            test/
            build/previews/
            coverage/lcov.info
          retention-days: 30
      - name: Configure Android SDK paths
        run: |
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties
      - name: Configure persistent APK signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Android signing secrets are required for main builds.'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/punch-card-release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' "$RUNNER_TEMP/punch-card-release.jks" "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
      - name: Build APK
        run: flutter build apk --release --build-number $((100 + GITHUB_RUN_NUMBER))
      - name: Prepare APK and checksum
        run: |
          mkdir -p dist
          APP_VERSION=$(awk '/^version:/ {print $2}' pubspec.yaml | cut -d+ -f1)
          APK_NAME="punch-card-record-$APP_VERSION.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/$APK_NAME"
          APK_SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$APK_SIGNER" verify --verbose --print-certs "dist/$APK_NAME" > dist/signature.txt
          cd dist
          sha256sum "$APK_NAME" > SHA256SUMS.txt
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: punch-card-record-apk
          path: dist/
          if-no-files-found: error
          retention-days: 90
      - name: Clean up signing files
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/punch-card-release.jks"
