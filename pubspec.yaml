name: punch_card_record
description: A private, local-first daily check-in calendar with portable backups.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Calendar widget
  table_calendar: 3.2.0
  # Date formatting
  intl: 0.20.2
  # State management
  provider: 6.1.5
  # Local storage for settings
  shared_preferences: 2.5.3
  # File system access for logs
  path_provider: 2.1.5
  file_picker: 10.3.3
  share_plus: 11.0.0
  # UUID generation
  uuid: 4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0

flutter:
  uses-material-design: true
  
  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
